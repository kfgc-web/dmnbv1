<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=4, user-scalable=yes">
<title>Domination: Britannia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<!-- ?v=N: número de versão. Aumente a cada atualização para o navegador
     buscar os arquivos novos em vez de usar a cópia guardada. -->
<link rel="stylesheet" href="estilo.css?v=8">
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <h1>DOMINATION: BRITANNIA</h1>
    </div>
    <div class="spacer"></div>
    <div class="tool">
      <button class="iconbtn ghost" id="zoomOut" title="Diminuir">−</button>
      <button class="iconbtn ghost" id="zoomIn" title="Ampliar">+</button>
      <button class="ghost" id="painelBtn" aria-controls="panel">Painel ▴</button>
      <button class="ghost" id="newGame">Novo jogo</button>
    </div>
  </header>

  <main>
    <div id="boardScroll">
      <div id="boardInner">
        <svg id="board" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div id="dice"></div>
    </div>

    <aside id="panel">
      <div class="turnbox">
        <div class="turnrow">
          <span class="dot" id="turnDot"></span>
          <span class="who" id="turnWho">—</span>
        </div>
        <div class="phasetag" id="phaseTag"></div>
        <div class="reinf" id="reinf"></div>
        <div class="instr" id="instr"></div>
      </div>

      <div class="actions" id="actions"></div>

      <div class="objetivobox" id="objetivoBox"></div>

      <div class="cartasbox" id="cartasBox"></div>

      <div id="mover">
        <div class="lbl" id="moverLbl"></div>
        <div class="stepper">
          <button class="iconbtn" id="moverMinus">−</button>
          <span class="qty" id="moverQty">1</span>
          <button class="iconbtn" id="moverPlus">+</button>
          <button class="primary" id="moverGo" style="flex:1">Mover</button>
          <button class="ghost" id="moverCancel">Cancelar</button>
        </div>
      </div>

      <div class="players" id="players"></div>

      <div class="logwrap">
        <h3>Crônica</h3>
        <div id="log"></div>
      </div>
    </aside>
  </main>
</div>

<div id="overlay"></div>
<div id="toast"></div>

<script src="mapa.js?v=8"></script>
<script src="motor.js?v=8"></script>
<script src="bots.js?v=8"></script>
<script src="desenho.js?v=8"></script>
<script src="cartas.js?v=8"></script>
<script src="telas.js?v=8"></script>
</body>
</html>
